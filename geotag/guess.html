<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PALIMPSESF — guess the year</title>
<style>
  @font-face{font-family:'Metana';src:url('../fonts/NeueMetanaMono-Light.otf') format('opentype');font-weight:300}
  @font-face{font-family:'Metana';src:url('../fonts/NeueMetanaMono-SemiBold.otf') format('opentype');font-weight:600}
  @font-face{font-family:'Whois';src:url('../fonts/whois-mono.woff') format('woff')}
  :root{--bg:#e9e6db;--paper:#f3f1e8;--ink:#0e0e10;--pastel:#eaf1fb;--blue:#2456d6;--red:#c9282d;
    --disp:'Metana',ui-monospace,monospace;--mono:'Whois',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
    background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(14,14,16,.05) 27px 28px)}
  header{display:flex;gap:2px;align-items:stretch;flex-wrap:wrap;padding:10px 10px 0}
  .hmod{border:2.5px solid var(--ink);background:var(--paper);padding:10px 14px}
  h1{font-family:var(--disp);font-weight:600;font-size:24px;margin:0;line-height:1}
  h1 a{color:inherit;text-decoration:none}
  h1 .ghost{opacity:.28}
  h1 .sf{color:var(--blue)}
  .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
  .meta{font-size:10px;text-transform:uppercase;letter-spacing:.06em;line-height:1.6;align-self:center;color:#55524a}
  .score{font-family:var(--disp);font-weight:600;font-size:24px;margin-left:auto;display:flex;align-items:center;gap:10px}
  main{max-width:860px;margin:0 auto;padding:12px 10px 80px;display:grid;gap:2px}
  .mod{border:2.5px solid var(--ink);background:var(--paper);padding:14px 16px}
  /* the photograph, framed like the postcards on the landmarks page */
  .pframe{background:#f2ecd9;border:1px solid #9a8d6f;outline:1px solid rgba(14,14,16,.55);outline-offset:2px;
    border-radius:2.5px;box-shadow:2px 3px 9px rgba(40,32,16,.35);padding:12px 12px 8px;margin:0 auto;max-width:640px}
  .pframe img{width:100%;max-height:56vh;object-fit:contain;display:block;
    border:1px solid #b7a882;filter:grayscale(1) sepia(.32) contrast(.96);opacity:0;transition:opacity .3s}
  .pframe img.ld{opacity:1}
  .pframe .where{font-family:var(--disp);font-weight:600;font-size:13px;margin-top:7px;color:#4c4028;text-transform:uppercase}
  .guessrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
  input[type=range]{flex:1;min-width:200px;appearance:none;height:3px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;background:var(--blue);border:3px solid var(--paper);outline:2px solid var(--ink);border-radius:0;cursor:ew-resize}
  .yr{font-family:var(--disp);font-weight:600;font-size:34px;min-width:100px;text-align:center}
  button{font-family:var(--disp);font-weight:600;font-size:13px;text-transform:uppercase;
    border:2.5px solid var(--ink);background:var(--pastel);color:var(--ink);padding:10px 20px;cursor:pointer}
  button:hover{background:var(--ink);color:var(--pastel)}
  #verdict{display:none}
  #verdict.on{display:block}
  .big{font-family:var(--disp);font-weight:600;font-size:clamp(20px,3.4vw,34px);text-transform:uppercase}
  .vgood{color:var(--blue)} .vbad{color:var(--red)}
  .cap{font-size:11px;line-height:1.6;margin-top:6px}
  .rounds{display:flex;gap:2px;margin-top:8px}
  .rdot{width:26px;height:26px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:600;font-size:10px;background:var(--paper)}
  .rdot.done{background:var(--pastel)}
</style>
</head>
<body>
<header>
  <div class="hmod">
    <h1><a href="../palimpsest.html"><span class="ghost">palimpse</span><span class="sf">sf</span></a></h1>
    <div class="lbl" style="margin-top:3px">guess the year</div>
  </div>
  <div class="hmod meta">
    the photograph and its location are real.<br>
    the year is yours to earn — 100 points, minus 2 per year you miss by
  </div>
  <div class="hmod meta"><a href="map.html" style="color:inherit"><b>← map</b></a></div>
  <div class="hmod score"><span id="round">R1/5</span><span id="pts">0 PTS</span></div>
</header>
<main>
  <section class="mod">
    <div class="pframe">
      <img id="photo" alt="a san francisco photograph, year withheld">
      <div class="where" id="where">…</div>
    </div>
    <div class="guessrow">
      <span class="lbl">your year</span>
      <input type="range" id="slider" min="1848" max="2026" value="1937">
      <span class="yr" id="yrval">1937</span>
      <button id="go">Lock it in</button>
    </div>
    <div id="verdict">
      <div class="big" id="vline"></div>
      <div class="cap" id="vcap"></div>
      <div style="margin-top:10px"><button id="next">Next photograph →</button></div>
    </div>
    <div class="rounds" id="rounds"></div>
  </section>
</main>
<script src="photos-data.js?v=20260924"></script>
<script src="guess.js?v=20260924"></script>
</body>
</html>
