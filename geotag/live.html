<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>PALIMPSESF — live</title>
<style>
  @font-face{font-family:'Metana';src:url('../fonts/NeueMetanaMono-SemiBold.otf') format('opentype');font-weight:600}
  @font-face{font-family:'Whois';src:url('../fonts/whois-mono.woff') format('woff')}
  :root{--paper:#f3f1e8;--ink:#0e0e10;--pastel:#eaf1fb;--blue:#2456d6;
    --disp:'Metana',ui-monospace,monospace;--mono:'Whois',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0a0b;overflow:hidden;font-family:var(--mono)}
  /* the camera is the ground layer — the present, live */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#0a0a0b}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:2px;padding:8px;z-index:5}
  .hmod{border:2.5px solid var(--ink);background:var(--paper);padding:7px 10px;color:var(--ink)}
  .hmod h1{font-family:var(--disp);font-weight:600;font-size:15px;margin:0;line-height:1}
  .hmod h1 a{color:inherit;text-decoration:none}
  .hmod h1 .ghost{opacity:.3}
  .hmod h1 .sf{color:var(--blue)}
  #stat{font-size:9px;letter-spacing:.08em;text-transform:uppercase;align-self:center;margin-left:auto}
  /* the collage: matched photographs, layered paper over the live feed */
  #stack{position:fixed;inset:0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;gap:0;padding:0 12vw;z-index:3;-webkit-overflow-scrolling:touch}
  .card{flex:0 0 72vw;max-width:430px;scroll-snap-align:center;margin:0 -6vw;position:relative;
    border:2.5px solid var(--ink);background:var(--paper);padding:9px 9px 12px;
    box-shadow:5px 5px 0 rgba(14,14,16,.65)}
  .card:nth-child(odd){transform:rotate(-2.4deg)}
  .card:nth-child(even){transform:rotate(1.8deg) translateY(12px)}
  .card img{width:100%;display:block;border:1.5px solid var(--ink);;object-fit:cover}
  .card .cy{font-family:var(--disp);font-weight:600;font-size:20px;margin-top:6px}
  .card .cc{font-size:10px;line-height:1.4;text-transform:uppercase;letter-spacing:.04em;max-height:42px;overflow:hidden}
  .card .cm{font-size:9px;opacity:.6;margin-top:3px}
  #none{position:fixed;left:50%;bottom:16vh;transform:translateX(-50%);z-index:3;
    border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:9px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:none;text-align:center;line-height:1.7}
  #big{position:fixed;inset:0;background:rgba(10,10,11,.96);z-index:20;display:none;align-items:center;justify-content:center}
  #big.on{display:flex}
  #big img{max-width:96%;max-height:88%;object-fit:contain;border:2.5px solid var(--paper)}
  #big .bc{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.06em;max-width:90%;text-align:center}
  /* desktop simulator (no camera / no compass) */
  #sim{position:fixed;bottom:12px;left:12px;right:12px;z-index:6;display:none;gap:2px;align-items:center}
  #sim .hmod{display:flex;gap:10px;align-items:center;font-size:10px;text-transform:uppercase;flex:1}
  #sim input{flex:1}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="hud">
  <div class="hmod"><h1><a href="map.html"><span class="ghost">palimpse</span><span class="sf">sf</span></a></h1></div>
  <div class="hmod" id="stat">◉ starting…</div>
</div>
<div id="stack"></div>
<div id="none">point down the street —<br>photos appear where a camera once pointed the same way</div>
<div id="big"><img alt=""><div class="bc"></div></div>
<div id="sim">
  <div class="hmod">heading <input id="simh" type="range" min="0" max="359" value="0"><span id="simhv">0°</span>
  <span style="opacity:.6">· no compass here — desktop simulator, standing at Portsmouth Square</span></div>
</div>
<script src="photos-data.js?v=20260709"></script>
<script src="live.js?v=4"></script>
</body>
</html>
